# Big Z Properties - Bookkeeping Configuration
# ============================================
#
# THIS FILE IS COMMITTED TO THE REPO. Secrets (Intuit client id/secret, the token encryption
# key) go in ../../conf/project.properties, which is NOT in git and is loaded AFTER this file
# (so it wins).

company             = bigz
environment         = production
logfile             = /home/ubuntu/bigz/applogs/app.log
var_dir             = /home/ubuntu/bigz/var
applog_dir          = /home/ubuntu/bigz/applogs

# QuickBooks Online
# -----------------
# The redirect URI is registered with Intuit and handled by bk.roundsphere.com (the bookkeeping
# repo in ~/books, whose company_dir.bigz points here). Client id/secret live in ../conf.
qbo.redirect_uri    = https://bk.roundsphere.com/qbo/callback.php

# Token file encryption (\RoundSphere\Encrypt). The key lives in ../conf.
encrypt.cipher      = AES-256-CTR

# bigz.roundsphere.com uploader (www/upload.php): files land here, outside the web root
uploads_dir         = /home/ubuntu/bigz/uploads

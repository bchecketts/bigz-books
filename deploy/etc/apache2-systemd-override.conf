## Ubuntu's apache2.service sets ProtectHome=read-only. Apache writes Big Z's site logs, and the QBO callback
## (bk.roundsphere.com) writes Big Z's token (var/) and error log (applogs/), so allow just those.
## Installed as a symlink next to bk.conf's override:
##   sudo ln -sf /home/ubuntu/bigz/bigz/deploy/etc/apache2-systemd-override.conf /etc/systemd/system/apache2.service.d/bigz.conf
##   sudo systemctl daemon-reload && sudo systemctl restart apache2
[Service]
ReadWritePaths=-/home/ubuntu/bigz/var -/home/ubuntu/bigz/applogs -/home/ubuntu/bigz/logs

## Installed as a symlink:
##   sudo ln -sf /home/ubuntu/bigz/bigz/deploy/etc/httpd.conf /etc/apache2/sites-available/bigz.conf
##   sudo a2ensite bigz && sudo apache2ctl configtest && sudo systemctl reload apache2

# bigz.roundsphere.com (~/bigz/bigz/www) — behind the shared AWS ALB, which terminates TLS (the *.roundsphere.com
# certificate) and forwards HTTP on :80. Every page needs a Google sign-in on the allow-list: pages here show
# Big Z's QuickBooks data.

# Request line logged as path only (%U): query strings can carry data
LogFormat "%h %l %u %t \"%m %U %H\" %>s %O \"%{User-Agent}i\"" bigz_noquery

<VirtualHost *:80>
    ServerName bigz.roundsphere.com
    DocumentRoot /home/ubuntu/bigz/bigz/www
    DirectoryIndex index.php

    TraceEnable Off

    # Enforce HTTPS even if the ALB's own redirect is removed (health checks carry no header)
    <If "%{HTTP:X-Forwarded-Proto} == 'http'">
        Redirect permanent / https://bigz.roundsphere.com/
    </If>

    Header always set Cache-Control "no-cache, no-store, must-revalidate"
    Header always set Pragma "no-cache"
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; form-action 'self'; frame-ancestors 'none'"

    # Google sign-in (mod_auth_openidc), allow-listed by email. Client ID/secret and the session key are in
    # ~/bigz/conf/oidc.conf (not in git, mode 600; Apache reads config as root). TLS ends at the ALB, so the module
    # builds its https callback URL from X-Forwarded-Proto. Sign out: /oauth2callback?logout=https%3A%2F%2Fbigz.roundsphere.com%2F
    Include /home/ubuntu/bigz/conf/oidc.conf
    OIDCXForwardedHeaders X-Forwarded-Proto X-Forwarded-Port
    # A week-long session that survives browser restarts and Apache reloads (the default server cache is wiped by each)
    OIDCSessionType client-cookie:persistent
    OIDCSessionInactivityTimeout 604800
    OIDCSessionMaxDuration 604800
    # The signed-in email is the user name in the access log and upload log
    OIDCRemoteUserClaim email
    # Browsers that remember the old Basic-auth login keep sending it; PHP would then report that name as the user
    # instead of the email. Sign-in is by cookie, so the header is never needed.
    RequestHeader unset Authorization

    <Directory /home/ubuntu/bigz/bigz/www>
        Options -Indexes
        AllowOverride None
    </Directory>

    # Read-only, except the uploader (upload.php also checks the request came from this site). Done here, before
    # authorization, so the allow-list below stays the only Require rule: nested in a RequireAll, a refused account got
    # a bare 401 instead of OIDCUnAutzAction's redirect.
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} !^(GET|HEAD)$
    RewriteCond "%{REQUEST_METHOD} %{REQUEST_URI}" "!^POST /upload\.php$"
    RewriteRule ^ - [F]

    <Location />
        AuthType openid-connect
        # Signed in with an account not on the list: a 401 whose page is not-authorized.html, with a sign-out link. Not
        # "302 <url>": the module sends that as a page that redirects by script, which the CSP blocks (blank page). Not
        # "auth", which loops.
        OIDCUnAutzAction 401
        ErrorDocument 401 /not-authorized.html
        # The allow-list: any one of these accounts (top-level Require lines are OR'd)
        Require claim email:brandon@roundsphere.com
        Require claim email:katie@roundsphere.com
        Require claim email:khchecketts@gmail.com
    </Location>

    # Where a signed-in but not allowed account is sent: reachable without authorization (else it loops), so the one
    # public page; nothing on it but a sign-out link
    <Location /not-authorized.html>
        AuthType None
        Require all granted
    </Location>

    # PCRE JIT allocation is blocked under Apache here; avoids a warning per request
    php_admin_value pcre.jit 0
    php_admin_flag expose_php off

    # Uploader: files up to 100 MB, sent one per request by upload.js
    php_admin_value upload_max_filesize 100M
    php_admin_value post_max_size 101M
    php_admin_value max_file_uploads 20

    ErrorLog /home/ubuntu/bigz/logs/error.log
    CustomLog /home/ubuntu/bigz/logs/access.log bigz_noquery
</VirtualHost>

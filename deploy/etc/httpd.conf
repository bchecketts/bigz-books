## Installed as a symlink:
##   sudo ln -sf /home/ubuntu/bigz/bigz/deploy/etc/httpd.conf /etc/apache2/sites-available/bigz.conf
##   sudo a2ensite bigz && sudo apache2ctl configtest && sudo systemctl reload apache2

# bigz.roundsphere.com (~/bigz/bigz/www) — behind the shared AWS ALB, which terminates TLS (the *.roundsphere.com
# certificate) and forwards HTTP on :80. Every page needs a login: pages here show Big Z's QuickBooks data.

# Request line logged as path only (%U): query strings can carry data
LogFormat "%h %l %u %t \"%m %U %H\" %>s %O \"%{User-Agent}i\"" bigz_noquery

<VirtualHost *:80>
    ServerName bigz.roundsphere.com
    DocumentRoot /home/ubuntu/bigz/bigz/www

    TraceEnable Off

    # Enforce HTTPS even if the ALB's own redirect is removed (health checks carry no header)
    <If "%{HTTP:X-Forwarded-Proto} == 'http'">
        Redirect permanent / https://bigz.roundsphere.com/
    </If>

    Header always set Cache-Control "no-cache, no-store, must-revalidate"
    Header always set Pragma "no-cache"
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'"

    # The password file is beside the repo (~/bigz/conf/htpasswd, readable by www-data), separate from the
    # RoundSphere reports' logins. Add or change a user with: htpasswd -B ~/bigz/conf/htpasswd <name>
    <Directory /home/ubuntu/bigz/bigz/www>
        Options -Indexes
        AllowOverride None
        AuthType Basic
        AuthName "Big Z Properties"
        AuthUserFile /home/ubuntu/bigz/conf/htpasswd
        Require valid-user
        # <If> authz replaces the grant above (LimitExcept would be OR-ed with it)
        <If "! (%{REQUEST_METHOD} in {'GET', 'HEAD'})">
            Require all denied
        </If>
    </Directory>

    # PCRE JIT allocation is blocked under Apache here; avoids a warning per request
    php_admin_value pcre.jit 0
    php_admin_flag expose_php off

    ErrorLog /home/ubuntu/bigz/logs/error.log
    CustomLog /home/ubuntu/bigz/logs/access.log bigz_noquery
</VirtualHost>
